<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EVA Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card">
    <div class="brand brand-compact">
      <img src="assets/logo.svg" alt="EVA Tracker" class="logo logo-small" />
    </div>

    <div class="header">
      <div>
        <div class="user-name" id="user-name"></div>
        <div class="user-email" id="user-email"></div>
      </div>
      <button class="link" id="admin-toggle-btn" hidden>Admin panel</button>
      <button class="link" id="change-password-toggle-btn" hidden>Change password</button>
      <button class="link" id="logout-btn">Switch user</button>
    </div>

    <div id="change-password-view" hidden>
      <div class="history-title" id="change-password-title">Change your password</div>
      <form id="change-password-form">
        <label for="current-password">Current password</label>
        <input type="password" id="current-password" required autocomplete="current-password" />

        <label for="new-password">New password</label>
        <input type="password" id="new-password" required minlength="8" autocomplete="new-password" />

        <div class="error" id="change-password-error"></div>

        <button type="submit" class="btn-primary">Update password</button>
      </form>
    </div>

    <div id="tracker-view">
      <div class="time-card">
        <div class="time-date" id="time-date"></div>
        <div class="time-value" id="time-value">00:00:00</div>
      </div>

      <div class="error" id="error"></div>

      <div class="actions">
        <div class="action">
          <div class="action-label" id="clock-label">&nbsp;</div>
          <button id="toggle-btn" class="btn-clockin"></button>
        </div>
        <div class="action">
          <div class="action-label" id="break-timer">01:00:00</div>
          <button id="break-btn" class="btn-break">Start Break</button>
        </div>
      </div>

      <div class="history-title">Shift history</div>
      <ul class="history-list" id="history-list"></ul>
    </div>

    <div id="admin-view" hidden>
      <div class="history-title">Today</div>
      <div class="error" id="admin-error"></div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="admin-table">
          <thead>
            <tr><th>Name</th><th>Status</th><th>Late</th><th>Left late</th><th></th></tr>
          </thead>
          <tbody id="admin-table-body"></tbody>
        </table>
      </div>
      <button id="admin-export-btn" class="btn-primary">Export CSV</button>

      <div class="history-title" id="edit-employee-title" hidden>Edit employee</div>
      <form id="edit-employee-form" hidden>
        <input type="hidden" id="edit-employee-id" />

        <label for="edit-employee-name">Name</label>
        <input type="text" id="edit-employee-name" required />

        <label for="edit-employee-clock-in">Scheduled clock-in</label>
        <input type="time" id="edit-employee-clock-in" />

        <label for="edit-employee-clock-out">Scheduled clock-out</label>
        <input type="time" id="edit-employee-clock-out" />

        <label for="edit-employee-break">Break allowance (minutes)</label>
        <input type="number" id="edit-employee-break" min="1" />

        <div class="error" id="edit-employee-error"></div>

        <button type="submit" class="btn-primary">Save changes</button>
        <button type="button" class="link" id="edit-employee-cancel-btn">Cancel</button>
      </form>

      <div class="history-title">Add employee</div>
      <form id="add-employee-form">
        <label for="employee-name">Name</label>
        <input type="text" id="employee-name" required />

        <label for="employee-email">Email</label>
        <input type="email" id="employee-email" required />

        <label for="employee-clock-in">Scheduled clock-in</label>
        <input type="time" id="employee-clock-in" />

        <label for="employee-clock-out">Scheduled clock-out</label>
        <input type="time" id="employee-clock-out" />

        <label for="employee-break">Break allowance (minutes)</label>
        <input type="number" id="employee-break" min="1" placeholder="60" />

        <div class="error" id="add-employee-error"></div>
        <div class="error" id="add-employee-success"></div>

        <button type="submit" class="btn-primary">Create employee</button>
      </form>
    </div>
  </div>

  <script src="tracker.js"></script>
</body>
</html>
