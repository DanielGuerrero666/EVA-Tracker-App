name: Release (superseded)

# .gitlab-ci.yml now owns releases: it publishes to the GitLab Package Registry,
# which is where electron-updater is pointed. This workflow is kept only as a
# manual escape hatch for producing an installer by hand.
#
# Its automatic tag trigger is deliberately removed. Left in place it would race
# the GitLab pipeline on the same tags and cut a GitHub release the app never
# reads — and since build.publish is now the generic provider, electron-builder
# has no publisher for it, so the upload would silently do nothing regardless.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Keeps package.json's version (what app.getVersion()/electron-updater
      # compare against) in sync with the tag, so publishing is just "push a
      # tag" — no separate commit to bump the version by hand beforehand.
      - name: Set package.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: eva-tracker-installer
          path: dist/EVA-Tracker-Setup-*.exe
